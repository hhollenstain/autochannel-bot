[project]
name = "autochannel-db"
version = "1.0.0"
description = "Shared AutoChannel database models and Alembic migrations"
# Kept lower than the UI so autochannel-bot can adopt it before upgrading Python.
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.14",
    "SQLAlchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autochannel_db"]
