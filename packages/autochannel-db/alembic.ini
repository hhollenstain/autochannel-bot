# AutoChannel shared schema migrations.
#   alembic -c packages/autochannel-db/alembic.ini upgrade head
# The database URL is read from SQLALCHEMY_DATABASE_URI (see migrations/env.py).

[alembic]
script_location = %(here)s/src/autochannel_db/migrations
path_separator = os

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
