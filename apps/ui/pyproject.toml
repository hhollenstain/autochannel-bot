[project]
name = "autochannel-ui"
version = "3.0.0"
description = "AutoChannel Discord Bot dashboard (Flask API + React frontend)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "autochannel-db",
    "coloredlogs>=15.0",
    "Flask>=3.1",
    "Flask-Compress>=1.17",
    "Flask-SQLAlchemy>=3.1",
    "prometheus-flask-exporter>=0.23",
    "psycopg[binary]>=3.2",
    "requests>=2.32",
    "requests-oauthlib>=2.0",
    "waitress>=3.0",
]

[project.urls]
Homepage = "https://github.com/hhollenstain/autochannel-ui"

[project.scripts]
autochannel_ui = "autochannel.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autochannel"]

# The DB package is a workspace member so the schema has a single home. When this
# repo merges with autochannel-bot, the bot becomes another member depending on it.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
autochannel-db = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
