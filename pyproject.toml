# Virtual uv workspace root: no package lives here. One `uv.lock` covers every member,
# so the bot and the UI always resolve the same autochannel-db (and SQLAlchemy).
[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "types-psycopg2>=2.9.0",
    "types-PyYAML>=6.0",
]
