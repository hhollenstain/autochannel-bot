name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  bot:
    name: Bot (lint, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bot
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --frozen --package autochannel
      - run: uv run --no-sync ruff format --check autochannel
      - run: uv run --no-sync ruff check autochannel
      - run: uv run --no-sync mypy --package autochannel --strict
      - run: uv run --no-sync pytest -v
